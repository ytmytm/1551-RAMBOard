name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Download KickAss
      - name: Download KickAss
        run: |
          curl http://theweb.dk/KickAssembler/KickAssembler.zip -H 'User-Agent: Hi There' --output KickAssembler.zip
          unzip KickAssembler.zip
          mkdir -p tools
          cp KickAss.jar tools/KickAss.jar

      # Build ROMs using Makefile
      - name: Build ROMs
        run: make

      # Upload artifacts
      - name: Archive patched 1551 ROM
        uses: actions/upload-artifact@v4
        with:
          name: 1551.318008-01-patched.bin
          path: 1551.318008-01-patched.bin

      - name: Archive 64K ROM image
        uses: actions/upload-artifact@v4
        with:
          name: 1551.318008-01-64k.bin
          path: 1551.318008-01-64k.bin
